
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Mentiras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="jogo">
        <h1>Detector de Mentiras</h1>
        <p>Responda às perguntas da investigação!</p>

        <div class="cenario">
            <div class="balao" id="pergunta">
                Vamos começar o interrogatório?
            </div>
            <img src="interrogatorio.png"
     alt="Cena de interrogatório"
     width="400">
     </div>

        <h3 id="numero">Pergunta 1 de 10</h3>

        <select id="resposta">
            <option value="">Selecione sua resposta</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
        </select>

        <button id="botaoResponder" onclick="responder()">
            Responder
        </button>

        <h2 id="resultado"></h2>
        <p id="mensagem"></p>

        <button id="reiniciar" onclick="reiniciarJogo()">
            Reiniciar
        </button>
    </div>

    <script src="trablhopw.js"></script>
</body>
</html>
